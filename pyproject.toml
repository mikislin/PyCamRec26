[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pycamrec"
version = "0.2.0rc1"
description = "Basler-focused scientific video acquisition recorder built from CamPy lessons."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=1.23",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
basler = ["pypylon==4.0.0"]
preview = ["opencv-python>=4.8"]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/mikislin/PyCamRec26"
Repository = "https://github.com/mikislin/PyCamRec26"
Issues = "https://github.com/mikislin/PyCamRec26/issues"

[project.scripts]
pycamrec = "pycamrec.cli:main"

[tool.setuptools.packages.find]
include = ["pycamrec*"]

[tool.setuptools.data-files]
"share/pycamrec" = [
  "a2A2448-210cm_40559189.pfs",
  "acA1300-200uc_24188001.pfs",
  "acA1300-200uc_24188001_mono8.pfs",
]
"share/pycamrec/configs" = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

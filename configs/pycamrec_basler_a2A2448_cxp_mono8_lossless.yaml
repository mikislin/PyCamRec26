config_schema_version: 2
profile: cxp_mono8_lossless_h264_nvenc_mp4

session:
  output_root: D:/PyCamRecSessions
  name: a2A2448_cxp_mono8_lossless
  operator: ""
  notes: Full-frame 200 fps lossless candidate; about 3.7-4.0 Gbps (28-30 GB/min). Not profile-locked.

camera:
  make: basler_cxp
  serial: "40559189"
  pfs_path: ../a2A2448-210cm_40559189.pfs
  expected_width: 2464
  expected_height: 2064
  expected_pixel_format: Mono8
  expected_fps: 200.0
  grab_timeout_ms: 2000
  max_num_buffer: 512
  enable_chunks: true
  strict_validation: true
  # DeviceTemperature warning/error thresholds for this model are 76/81 C;
  # qualify below the conservative 70 C warning and never reach 76 C critical.
  temperature_warning_c: 70.0
  temperature_critical_c: 76.0
  health_check_interval_s: 10.0

writer:
  segment_seconds: 30
  expected_bitrate_mbps: 4000
  min_free_space_gb: 80
  ffmpeg_path: C:/ffmpeg/ffmpeg-2025-09-28-git-0fdb5829e3-full_build/bin/ffmpeg.exe
  ffprobe_path: C:/ffmpeg/ffmpeg-2025-09-28-git-0fdb5829e3-full_build/bin/ffprobe.exe

experiment:
  schema_version: 2
  project:
    project_id: UNSPECIFIED
    protocol_id: UNSPECIFIED
    assay_id: UNSPECIFIED
  subject:
    subject_id: UNSPECIFIED
    species: mouse
    date_of_birth: ""
    postnatal_day: null
    postnatal_day_source: manual
    p0_convention: birth_date_is_p0
    weight_g: null
    weight_measured_utc: ""
    genotype: UNSPECIFIED
    experimental_group: UNSPECIFIED
    sex: UNSPECIFIED
  acquisition:
    experimenter_id: UNSPECIFIED
    run_index: 1
  custom_fields: {}
  notes: ""

metadata:
  per_frame_format: csv
  flush_every_frames: 200
  record_host_timestamps: true
  source_frame_hash_every: 0
  source_frame_hash_max_frames: 0

preview:
  enabled: false
  max_fps: 10.0
  width: 512
  overlay: true
  window_title: PyCamRec Preview
  shed_queue_fraction: 0.10
  shed_fps_ratio: 0.99
  throttle_cooldown_s: 2.0
  opencv_threads: 1

approval:
  status: requires_hardware_validation
  intended_preview_mode: off
  evidence_fingerprint_sha256: ""

qualification:
  policy: cxp_profile_lock_v2
  durations_s: [30, 60]
  required_repeats: 3
  preview_modes: ["off"]
  require_exact_pixel_samples: true
  require_task_quality_record: false

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install -e .[test] build
      - name: Compile
        run: python -m compileall -q pycamrec tests
      - name: Test
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: Audit public release surface
        run: python scripts/release_audit.py
      - name: Tk startup smoke
        run: python -c "import tkinter as tk; root=tk.Tk(); root.withdraw(); root.update(); root.destroy()"
      - name: Build release artifacts
        if: matrix.python-version == '3.11'
        run: python -m build
